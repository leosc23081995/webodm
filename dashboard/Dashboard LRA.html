<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard LRA · Gerencial Financeiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard-styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="dashboard-data.js"></script>
  <script type="text/babel" src="dashboard-charts.jsx"></script>
  <script type="text/babel" src="dashboard-l0-l1.jsx"></script>
  <script type="text/babel" src="dashboard-l2-l3.jsx"></script>
  <script type="text/babel" src="dashboard-l4.jsx"></script>
  <script type="text/babel" src="dashboard-l5.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useEffect } = React;

    const NAV = [
      { id: "L0", num: "L0", label: "Síntese executiva", count: "4 KPIs · 3 alertas", desc: "90s · diretoria" },
      { id: "L1", num: "L1", label: "Operação", count: "P&L · sazonalidade", desc: "5 min · controller" },
      { id: "L2", num: "L2", label: "Análises críticas", count: "4 vetores", desc: "15 min · CFO" },
      { id: "L3", num: "L3", label: "Drill-down", count: "heatmap · pivots", desc: "analista" },
      { id: "L4", num: "L4", label: "Governança", count: "14 achados", desc: "auditoria" },
      { id: "L5", num: "L5", label: "Engenharia de dados", count: "SQL · pipeline", desc: "TI · dados" },
    ];

    function App() {
      const [tab, setTab] = useState("L0");
      const [empresa, setEmpresa] = useState("REUNIDOS");

      // sync to hash
      useEffect(() => {
        const fromHash = (window.location.hash || "").replace("#", "");
        if (NAV.find(n => n.id === fromHash)) setTab(fromHash);
        const onHash = () => {
          const h = (window.location.hash || "").replace("#", "");
          if (NAV.find(n => n.id === h)) setTab(h);
        };
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);

      useEffect(() => { window.location.hash = tab; }, [tab]);

      function renderPage() {
        switch (tab) {
          case "L0": return <window.L0Sintese empresa={empresa} />;
          case "L1": return <window.L1Operacao empresa={empresa} />;
          case "L2": return <window.L2Analises empresa={empresa} />;
          case "L3": return <window.L3Drill empresa={empresa} />;
          case "L4": return <window.L4Governanca empresa={empresa} />;
          case "L5": return <window.L5DataFlow empresa={empresa} />;
          default: return <window.L0Sintese empresa={empresa} />;
        }
      }

      return (
        <>
          <div className="topbar">
            <div className="brand">
              <div className="brand-mark"></div>
              <div>
                <div className="brand-name">Dashboard LRA</div>
                <div className="brand-sub">REUNIDOS · DESCART · v6</div>
              </div>
            </div>
            <div className="topbar-center">
              <div className="seg">
                <button className={empresa === "REUNIDOS" ? "on" : ""} onClick={() => setEmpresa("REUNIDOS")}>REUNIDOS</button>
                <button className={empresa === "DESCART" ? "on" : ""} onClick={() => setEmpresa("DESCART")}>DESCART</button>
                <button className={empresa === "CONSOL" ? "on" : ""} onClick={() => setEmpresa("CONSOL")}>Consolidado</button>
              </div>
              <span className="chip-meta">Janela <strong>jan/24 — mai/26</strong></span>
              <span className="chip-meta">29 meses · 2 empresas</span>
            </div>
            <div className="topbar-right">
              <span className="chip-meta">Fonte <strong>SGC + SGC2</strong></span>
              <span className="chip-meta">Atualizado <strong>17/mai/26</strong></span>
            </div>
          </div>

          <div className="shell">
            <aside className="sidenav">
              <div className="nav-section">Navegação</div>
              {NAV.map(n => (
                <div key={n.id} data-l={n.id} className={"nav-item" + (tab === n.id ? " on" : "")} onClick={() => setTab(n.id)}>
                  <span className="nav-num">{n.num}</span>
                  <div>
                    <div>{n.label}</div>
                    <div style={{ fontSize: 10.5, color: tab === n.id ? "rgba(250,250,249,0.6)" : "var(--ink-4)", fontFamily: "var(--font-mono)", marginTop: 1 }}>{n.desc}</div>
                  </div>
                  <span className="nav-count" style={{ fontSize: 9.5 }}>{n.count.split(" · ")[0]}</span>
                </div>
              ))}

              <div className="nav-divider"></div>
              <div className="nav-section">Cadastros</div>
              <div className="nav-item" style={{ opacity: 0.55, cursor: "not-allowed" }}>
                <span className="nav-num">D1</span>
                <div>Mapa Clifor<div style={{ fontSize: 10.5, color: "var(--ink-4)", fontFamily: "var(--font-mono)" }}>—</div></div>
                <span className="nav-count">97</span>
              </div>
              <div className="nav-item" style={{ opacity: 0.55, cursor: "not-allowed" }}>
                <span className="nav-num">D2</span>
                <div>Plano de contas<div style={{ fontSize: 10.5, color: "var(--ink-4)", fontFamily: "var(--font-mono)" }}>—</div></div>
                <span className="nav-count">50+</span>
              </div>

              <div className="nav-meta-box">
                <div className="label">Resultado consolidado</div>
                <div className="row"><span>CAR total</span><span className="v">R$ 278M</span></div>
                <div className="row"><span>CAP total</span><span className="v">R$ 409M</span></div>
                <div className="row"><span>Resultado</span><span className="v" style={{ color: "var(--green)" }}>R$ 172M</span></div>
                <div className="row"><span>Gap IC</span><span className="v" style={{ color: "var(--red)" }}>R$ 16,6M</span></div>
              </div>
            </aside>

            <main className="main">{renderPage()}</main>
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
